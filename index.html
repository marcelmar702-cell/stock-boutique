<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5eff">
<title>Dukyo</title>
<style>
:root{--bg:#f4f6fb;--bg2:#dce6fb;--card:rgba(255,255,255,.84);--field:rgba(240,244,252,.95);--text:#1b2433;--muted:#5d6b82;--accent:#1f5eff;--accent2:#3f7bff;--accent-text:#fff;--border:rgba(31,60,120,.18);--shadow:0 12px 40px rgba(31,60,120,.16);--error:#b3261e;--ok:#1b7a3d;--warn:#a15c00;--glow:31,94,255;--glow-alpha:.55}
:root[data-theme="dark"]{--bg:#10151f;--bg2:#131c36;--card:rgba(20,28,48,.8);--field:rgba(9,14,27,.75);--text:#eef2fa;--muted:#9fb0c9;--accent:#6c93ff;--accent2:#9db6ff;--accent-text:#0d1424;--border:rgba(159,176,201,.22);--shadow:0 12px 40px rgba(0,0,0,.5);--error:#ff8a80;--ok:#7ddc9a;--warn:#ffc266;--glow:160,190,255;--glow-alpha:.85}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px 40px;background:radial-gradient(ellipse at 20% 0%,var(--bg2) 0%,var(--bg) 60%);background-attachment:fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;animation:apparait 2.2s ease both}
body.hasnav{padding-bottom:96px}
@keyframes apparait{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.card{position:relative;z-index:1;width:100%;max-width:440px;margin-top:8px;padding:26px;border-radius:20px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fadeUp .6s ease both}
body,.card,input,select,button{transition:background-color .3s ease,color .3s ease,border-color .3s ease,transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,filter .3s ease}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.lang{display:flex;gap:6px}
.lang button{width:auto;margin:0;background:none;border:1px solid var(--border);color:var(--muted);padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;min-width:38px}
.lang button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
#btn-theme{font-size:16px;line-height:1;background:var(--field);color:var(--text)}
h1.logo{margin:0;font-size:30px;font-weight:800;letter-spacing:-.3px;
 background-image:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%),linear-gradient(90deg,var(--accent) 0 58%,#1f9d6b 58% 100%);
 background-size:250% 100%,100% 100%;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brille 7s ease-in-out infinite}
@keyframes brille{0%{background-position:160% 0,0 0}100%{background-position:-60% 0,0 0}}
p.sub{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
label.lb{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--muted)}
input,select{width:100%;padding:12px 13px;font-size:16px;border-radius:11px;border:1px solid var(--border);background:var(--field);color:var(--text);font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--glow),.22);transform:translateY(-2px)}
button{position:relative;overflow:hidden;cursor:pointer;font-family:inherit}
button.main{width:100%;margin-top:16px;padding:13px;font-size:16px;font-weight:700;border:0;border-radius:11px;color:var(--accent-text);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(var(--glow),.3)}
button.link{width:100%;margin-top:12px;padding:11px;font-size:15px;font-weight:600;background:none;border:1px solid var(--border);border-radius:11px;color:var(--text)}
button.small{width:auto;padding:7px 11px;margin:0 0 0 6px;font-size:13px;font-weight:600;background:var(--field);border:1px solid var(--border);border-radius:9px;color:var(--text)}
button.danger{color:var(--error)}
button:not(:disabled):active{transform:scale(.93)}
button:disabled{opacity:.5;cursor:default}
.onde{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:onde .8s ease-out forwards;pointer-events:none}
@keyframes onde{to{transform:scale(1);opacity:0}}
#msg{color:var(--error);font-size:14px;min-height:18px;margin-top:10px;word-break:break-word}
#ok{color:var(--ok);font-size:14px;margin-top:4px;word-break:break-word}
.entete{display:flex;justify-content:space-between;align-items:center}
.entete h2{margin:6px 0;font-size:20px}
.aide{width:34px;height:34px;padding:0;border-radius:50%;background:var(--field);border:1px solid var(--border);color:var(--text);font-size:16px}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;margin-top:10px;background:var(--field);border-radius:14px;animation:fadeUp .4s ease both}
.ligne small{color:var(--muted)}
.rouge{color:var(--error)!important;font-weight:600}
.orange{color:var(--warn)!important;font-weight:600}
.vert{color:var(--ok)}
.alerte{background:var(--field);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:12px;padding:10px;margin-top:12px;font-size:14px}
.etape{display:flex;gap:12px;align-items:flex-start;padding:12px;margin-top:10px;background:var(--field);border-radius:14px;animation:fadeUp .6s ease both}
.etape:nth-of-type(2){animation-delay:.12s}.etape:nth-of-type(3){animation-delay:.24s}.etape:nth-of-type(4){animation-delay:.36s}.etape:nth-of-type(5){animation-delay:.48s}
.etape .ico{font-size:24px}
.etape b{font-size:15px}.etape p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.hidden{display:none}
h3{margin:18px 0 6px;font-size:16px}
.blk{padding:12px;margin-top:10px;background:var(--field);border-radius:14px;animation:fadeUp .4s ease both;font-size:14px;line-height:1.5}
.blk .nom{font-size:16px;font-weight:700}
.blk .rang{display:flex;gap:8px;align-items:center;margin-top:8px}
.blk .rang select{flex:1}
.blk .rang button{margin:0;white-space:nowrap}
.muted{color:var(--muted)}
.tag-ok{color:var(--ok);font-weight:600}
.tag-bad{color:var(--error);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sbox{background:var(--field);border-radius:14px;padding:12px;text-align:center}
.sbox b{display:block;font-size:26px}
.sbox small{color:var(--muted);font-size:12px}
.ag{margin-top:12px;padding:12px;border-radius:14px;background:var(--field);border:2px solid var(--warn);animation:pouls 2s ease-in-out infinite}
.ag.urgent{border-color:var(--error)}
.ag .agt{font-weight:800;font-size:15px;margin-bottom:6px}
.ag .agl{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:14px}
.ag button.main{margin-top:10px;padding:10px;font-size:15px}
@keyframes pouls{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.35)}50%{box-shadow:0 0 0 6px rgba(179,38,30,0)}}
.okbox{margin-top:12px;padding:12px;border-radius:14px;background:var(--field);border-left:4px solid var(--ok);font-size:14px}
.prod{padding:12px;margin-top:10px;background:var(--field);border-radius:14px;animation:fadeUp .4s ease both}
.prod .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prod .ph b{font-size:16px}
.prod .tot{font-weight:800;font-size:18px}
.prod .lot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0 0;margin-top:8px;border-top:1px solid var(--border);font-size:14px}
.prod .lot small{color:var(--muted)}
.prod .vide{opacity:.55}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.10)}
.bnav button{flex:1 1 0;max-width:104px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:600;padding:2px 1px;cursor:pointer;position:relative;overflow:visible}
.bnav .ic{display:flex;align-items:center;justify-content:center;width:46px;height:28px;border-radius:14px}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav .nl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav button.on{color:var(--text)}
.bnav button.on .ic{background:var(--accent);color:var(--accent-text)}
.bnav.hidden{display:none}
.bnav .dot{position:absolute;top:0;left:calc(50% + 8px);width:12px;height:12px;border-radius:50%;background:#e53935;border:2px solid var(--card)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
:root{--card:rgba(255,255,255,.72);--glow:20,130,150}
:root[data-theme="dark"]{--card:rgba(20,28,48,.7);--glow:130,225,200}
.card{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
button.main{background:linear-gradient(135deg,var(--accent),#1f9d6b)!important;box-shadow:0 6px 18px rgba(31,157,107,.28)!important}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;color:var(--accent)}
.deco svg{position:absolute;opacity:.3}
.deco .d{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.deco .f{fill:currentColor;stroke:none;opacity:.35}
.deco .v{color:#1f9d6b}
.deco text{fill:currentColor;font-weight:700;font-family:system-ui,sans-serif}
.dp{left:-4px;bottom:14px;width:150px;animation:flo 8s ease-in-out infinite}
.dp .tete{transform-origin:60px 60px;animation:balance 5s ease-in-out infinite}
.ds{right:-12px;bottom:26px;width:175px;animation:flo 9s ease-in-out -2s infinite}
.dc{left:40%;bottom:10px;width:80px;animation:flo 7s ease-in-out -4s infinite}
.db{left:-16px;top:44%;width:105px;animation:flo 10s ease-in-out -1s infinite}
.dg{right:-14px;top:52%;width:80px;animation:flo 8.5s ease-in-out -5s infinite}
.qm{animation:qm 3.2s ease-in-out infinite}
.qm2{animation-delay:-1.1s}.qm3{animation-delay:-2.2s}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes balance{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes qm{0%,100%{opacity:.2;transform:translateY(3px)}50%{opacity:1;transform:translateY(-3px)}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="deco" aria-hidden="true">
  <svg class="dp" viewBox="0 0 130 170">
    <g class="tete">
      <circle class="d" cx="60" cy="38" r="16"/>
      <path class="d" d="M51 36h6M63 36h6"/>

<div class="card">
  <div class="top">
    <h1 class="logo">Dukyo</h1>
    <div class="lang">
      <button id="btn-fr" type="button" onclick="langue('fr');afficher()">FR</button>
      <button id="btn-sw" type="button" onclick="langue('sw');afficher()">SW</button>
      <button id="btn-theme" type="button" onclick="basculeTheme()"></button>
    </div>
  </div>
  <p class="sub" data-t="slogan"></p>
  <div id="msg"></div>
  <div id="ok"></div>

  <div id="auth" class="hidden">
    <label class="lb" for="email" data-t="lEmail"></label>
    <input id="email" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="lb" for="pass" data-t="lPass"></label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="main" type="button" onclick="connecter()" data-t="login"></button>
    <button class="link" type="button" onclick="montrerInsc()" data-t="signup"></button>
  </div>

  <div id="insc" class="hidden">
    <h2 data-t="iTitre"></h2><p class="sub" data-t="iSub"></p>
    <label class="lb" for="iEmail" data-t="lEmail"></label>
    <input id="iEmail" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="lb" for="iPass" data-t="iPass"></label><input id="iPass" type="password" autocomplete="new-password">
    <label class="lb" for="iPass2" data-t="iPass2"></label><input id="iPass2" type="password" autocomplete="new-password">
    <button class="main" type="button" onclick="inscrire2()" data-t="iBtn"></button>
    <button class="link" type="button" onclick="retourLogin()" data-t="iRetour"></button>
  </div>

  <div id="creer" class="hidden">
    <label class="lb" for="nomMagasin" data-t="lNomMag"></label>
    <input id="nomMagasin">
    <button class="main" type="button" onclick="creerMagasin()" data-t="creerMag"></button>
    <button class="link" type="button" onclick="sortir()" data-t="logout"></button>
  </div>

  <div id="bloque" class="hidden">
    <h2 data-t="bloqueTitre"></h2>
    <p class="sub" data-t="bloqueTxt"></p>
    <button class="link" type="button" onclick="sortir()" data-t="logout"></button>
  </div>

  <div id="bienvenue" class="hidden">
    <h2><span data-t="karibu"></span> <span id="wNom"></span> !</h2>
    <p class="sub" data-t="wIntro"></p>
    <div class="etape"><span class="ico">📦</span><div><b data-t="w1t"></b><p data-t="w1d"></p></div></div>
    <div class="etape"><span class="ico">📒</span><div><b data-t="w2t"></b><p data-t="w2d"></p></div></div>
    <div class="etape"><span class="ico">💰</span><div><b data-t="w3t"></b><p data-t="w3d"></p></div></div>
    <div class="etape"><span class="ico">📈</span><div><b data-t="w4t"></b><p data-t="w4d"></p></div></div>
    <button class="main" type="button" onclick="allerApp()" data-t="commencer"></button>
  </div>

  <!-- ===== Compte boutique ===== -->
  <div id="app" class="hidden">
    <div class="entete"><h2 id="titre"></h2><button class="aide" type="button" onclick="ouvrirBienvenue()">?</button></div>

    <div id="p_home"><div id="homeBox"></div></div>

    <div id="p_prod" class="hidden">
      <label class="lb" for="pNom" data-t="lProd"></label><input id="pNom" list="dlProd" autocomplete="off">
      <datalist id="dlProd"></datalist>
      <label class="lb" for="pQte" data-t="lQte"></label><input id="pQte" type="number" inputmode="numeric">
      <label class="lb" for="pDate" data-t="lDateExp"></label><input id="pDate" type="date">
      <button class="main" type="button" onclick="ajoutProd()" data-t="ajouter"></button>
      <div id="alerteProd"></div>
      <div id="listeProd"></div>
    </div>

    <div id="p_det" class="hidden">
      <label class="lb" for="dNom" data-t="lClient"></label><input id="dNom">
      <label class="lb" for="dMont" data-t="lMontant"></label><input id="dMont" type="number" inputmode="decimal">
      <button class="main" type="button" onclick="ajoutDette()" data-t="ajouter"></button>
      <h3 id="totDet"></h3>
      <div id="listeDet"></div>
    </div>

    <div id="p_ven" class="hidden">
      <label class="lb" for="vNom" data-t="lProd"></label><input id="vNom" list="dlProd" autocomplete="off">
      <label class="lb" for="vMont" data-t="lMontant"></label><input id="vMont" type="number" inputmode="decimal">
      <button class="main" type="button" onclick="ajoutVente()" data-t="ajouter"></button>
      <h3 id="totVen"></h3>
      <div id="listeVen"></div>
    </div>

    <div id="p_abo" class="hidden"><div id="aboBox"></div></div>

    <button class="link" type="button" onclick="sortir()" data-t="logout"></button>
  </div>

  <!-- ===== Compte propriétaire Dukyo ===== -->
  <div id="admin" class="hidden">
    <h2 data-t="adminTitre"></h2>
    <div id="a_aabo"></div>
    <div id="a_apay" class="hidden"></div>
    <div id="a_amag" class="hidden"></div>
    <button class="link" type="button" onclick="sortir()" data-t="logout"></button>
  </div>
</div>

let L = localStorage.getItem("lang") || "fr";
const t = k => (T[L] && T[L][k] != null) ? T[L][k] : k;

/* ---------- Thème clair / sombre (comme SchoolLink) ---------- */
function themeActuel(){
  const s = localStorage.getItem("theme");
  if (s === "light" || s === "dark") return s;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function appliquerTheme(){
  const eff = themeActuel();
  document.documentElement.setAttribute("data-theme", eff);
  document.documentElement.style.colorScheme = eff;
  const b = $("btn-theme");
  b.textContent = eff === "dark" ? "\u2600" : "\u263E";
  const lab = eff === "dark" ? t("toLight") : t("toDark");
  b.setAttribute("aria-label", lab); b.title = lab;
  if (typeof readGlow === "function") { readGlow(); if (reduceMotion) drawLights(); }
}
function basculeTheme(){
  localStorage.setItem("theme", themeActuel() === "dark" ? "light" : "dark");
  appliquerTheme();
}

function langue(l){
  L = l; localStorage.setItem("lang", l);
  document.documentElement.lang = l === "sw" ? "sw" : "fr";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[l][e.dataset.t]);
  $("btn-fr").className = l === "fr" ? "on" : "";
  $("btn-sw").className = l === "sw" ? "on" : "";
  appliquerTheme();
}

/* ---------- Fond : petites lumières en mouvement (même effet que SchoolLink) ---------- */
var bg = $("bg"), ctx = bg.getContext("2d"), lights = [], vw = 0, vh = 0;
var glowRGB = "31, 94, 255", glowAlpha = 0.6;
var reduceMotion = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
function readGlow(){
  var cs = getComputedStyle(document.documentElement);
  glowRGB = cs.getPropertyValue("--glow").trim() || glowRGB;
  glowAlpha = parseFloat(cs.getPropertyValue("--glow-alpha")) || glowAlpha;
}
function buildLights(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = innerWidth; vh = innerHeight;
  bg.width = Math.round(vw * dpr); bg.height = Math.round(vh * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var count = Math.round(Math.min(80, Math.max(26, (vw * vh) / 15000)));
  lights = [];
  for (var i = 0; i < count; i++) lights.push({
    x: Math.random() * vw, y: Math.random() * vh, r: 0.8 + Math.random() * 1.9,
    vx: (Math.random() - 0.5) * 0.3, vy: -0.05 - Math.random() * 0.28,
    p: Math.random() * Math.PI * 2, s: 0.008 + Math.random() * 0.02 });
}
function drawLights(){
  ctx.clearRect(0, 0, vw, vh);
  for (var i = 0; i < lights.length; i++) {
    var l = lights[i], a = glowAlpha * (0.45 + 0.55 * Math.sin(l.p));
    if (a < 0.02) continue;
    ctx.fillStyle = "rgba(" + glowRGB + "," + (a * 0.16).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r * 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(" + glowRGB + "," + a.toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2); ctx.fill();
  }
}
function animerLights(){
  for (var i = 0; i < lights.length; i++) {
    var l = lights[i];
    l.x += l.vx; l.y += l.vy; l.p += l.s;
    if (l.y < -10) { l.y = vh + 10; l.x = Math.random() * vw; }
    if (l.x < -10) l.x = vw + 10;
    if (l.x > vw + 10) l.x = -10;
  }
  drawLights();
  requestAnimationFrame(animerLights);
}
function initFond(){
  readGlow(); buildLights();
  var rt = null;
  addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){ buildLights(); if (reduceMotion) drawLights(); }, 150); });
  if (reduceMotion) drawLights(); else animerLights();
}

/* ---------- Onde douce au toucher ---------- */
document.addEventListener("pointerdown", function(e){
  var b = e.target.closest("button");
  if (!b) return;
  var r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2;
  var d = document.createElement("span");
  d.className = "onde";
  d.style.cssText = "width:"+s+"px;height:"+s+"px;left:"+(e.clientX-r.left-s/2)+"px;top:"+(e.clientY-r.top-s/2)+"px";
  b.appendChild(d);
  setTimeout(function(){ d.remove(); }, 800);
});

function erreur(e){
  const m = (e && e.message) ? e.message : String(e);
  if (m.indexOf("PENDING_EXISTS") !== -1) return t("aAttente");
  if (m.indexOf("NOT_ADMIN") !== -1) return t("pasAdmin");
  return m;
}
function auj0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function jours(dateStr){
  if (!dateStr) return null;
  return Math.round((new Date(dateStr + "T00:00:00") - auj0()) / 864e5);
}
function cle(s){ return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim(); }
function fc(n){ return Number(n).toLocaleString("fr-FR"); }

function shopFerme(){
  if (!SHOP || SHOP.status !== "active") return true;
  const j = jours(SHOP.subscription_end);
  return j === null || j < 0;
}
function onglet(id){
  if (shopFerme() && id !== "abo") id = "abo";
  curTab = id;
  SHOP_TABS.forEach(x => $("p_" + x[0]).classList.toggle("hidden", x[0] !== id));
  dessinerNav(SHOP_TABS, id);
  if (id === "home") rendreHome();
  if (id === "abo") chargerAbo();
}

/* ---------- Produits : un produit = un nom, plusieurs lots (dates) ---------- */
function etatLot(l){
  const q = Number(l.quantity) || 0;
  if (!l.expiry_date) return { txt: "", cls: "", j: null, alerte: false, q: q };
  const j = jours(l.expiry_date);
  if (j < 0) return { txt: t("expDepuis") + " " + (-j) + " " + t("jU"), cls: "rouge", j: j, alerte: q > 0, q: q };
  if (j === 0) return { txt: t("auj"), cls: "rouge", j: j, alerte: q > 0, q: q };
  return { txt: j + " " + t("jours"), cls: j <= 7 ? "rouge" : (j <= 30 ? "orange" : ""), j: j, alerte: q > 0 && j <= 30, q: q };
}
function grouper(){
  const m = new Map();
  PRODS.forEach(p => {
    const k = cle(p.name);
    if (!m.has(k)) m.set(k, { nom: p.name, lots: [] });
    m.get(k).lots.push(p);
  });
  const arr = Array.from(m.values());
  arr.forEach(g => {
    g.lots.sort((a, b) => (a.expiry_date || "9999-99-99").localeCompare(b.expiry_date || "9999-99-99"));
    g.total = g.lots.reduce((s, l) => s + (Number(l.quantity) || 0), 0);
    const actif = g.lots.find(l => (Number(l.quantity) || 0) > 0);
    g.prochaine = actif ? (actif.expiry_date || "9999-99-99") : "9999-99-99z";
  });
  arr.sort((a, b) => a.prochaine.localeCompare(b.prochaine) || a.nom.localeCompare(b.nom));
  return arr;
}
async function ajoutProd(){
  msg("");
  let name = $("pNom").value.trim();
  if (!name) return msg(t("nomReq"));
  const dej = PRODS.find(p => cle(p.name) === cle(name));
  if (dej) name = dej.name;
  const { error } = await db.from("products").insert({
    shop_id: shopId, name, quantity: parseInt($("pQte").value) || 0, expiry_date: $("pDate").value || null });
  if (error) return msg(error.message);
  $("pNom").value = $("pQte").value = $("pDate").value = "";
  chargerProd();
}
async function chargerProd(){
  const { data } = await db.from("products").select("*").eq("shop_id", shopId)
    .order("expiry_date", { ascending: true, nullsFirst: false });
  PRODS = data || [];
  rendreProd();
  if (curTab === "home") rendreHome();
}
function rendreProd(){
  const g = grouper();
  $("dlProd").innerHTML = g.map(x => '<option value="' + esc(x.nom) + '">').join("");
  let proches = 0, html = "";
  g.forEach(x => {
    let lots = "";
    x.lots.forEach(l => {
      const e = etatLot(l);
      if (e.alerte) proches++;
      lots += '<div class="lot' + (e.q === 0 ? ' vide' : '') + '"><span>' + esc(l.expiry_date || "—") + ' · <b>' + e.q + '</b><br><small class="' + e.cls + '">' + esc(e.txt) + '</small></span>'
        + '<span><button class="small" type="button" onclick="modQte(\'' + l.id + '\',' + e.q + ')">' + t("modQte") + '</button>'
        + '<button class="small" type="button" onclick="suppr(\'products\',\'' + l.id + '\')">' + t("suppr") + '</button></span></div>';
    });
    html += '<div class="prod"><div class="ph"><b>' + esc(x.nom) + '</b><span class="tot">' + x.total + '</span></div>'
      + (x.lots.length > 1 ? '<small class="muted">' + x.lots.length + ' ' + t("lotsN") + '</small>' : '') + lots + '</div>';
  });
  $("alerteProd").innerHTML = proches ? '<div class="alerte">' + t("alerte") + proches + '</div>' : "";
  $("listeProd").innerHTML = html || '<p class="sub">' + t("rien") + '</p>';
}
async function modQte(id, actuel){

  if (v === null) return;
  const n = parseInt(v, 10);
  if (isNaN(n) || n < 0) return msg(t("qteBad"));
  const { error } = await db.from("products").update({ quantity: n }).eq("id", id);
  if (error) return msg(error.message);
  msg(""); chargerProd();
}

  lots.sort((a, b) => a.e.j - b.e.j);

    const urgent = lots.some(x => x.e.j <= 7);
    h += '<div class="ag' + (urgent ? ' urgent' : '') + '"><div class="agt">⚠️ ' + esc(t("hAlerte").replace("{n}", lots.length)) + '</div>';

  } else {
    h += '<div class="okbox">✅ ' + t("hRas") + '</div>';

  h += '<div class="stats"><div class="sbox"><b>' + g.length + '</b><small>' + t("hNb") + '</small></div>'

  $("homeBox").innerHTML = h;
}

  (data || []).forEach(d => {
    if (!d.paid) total += Number(d.amount);
    html += '<div class="ligne"><span class="' + (d.paid ? "vert" : "") + '">' + esc(d.customer_name) + ' : ' + d.amount + ' FC</span><span>'
      + (d.paid ? "✔" : '<button class="small" type="button" onclick="payer(\'' + d.id + '\')">' + t("paye") + '</button>')
      + '<button class="small" type="button" onclick="suppr(\'debts\',\'' + d.id + '\')">' + t("suppr") + '</button></span></div>';
  });
  $("totDet").textContent = t("totDet") + total + " FC";
  $("listeDet").innerHTML = html || '<p class="sub">' + t("rien") + '</p>';
}

/* ---------- Ventes ---------- */
async function ajoutVente(){
  msg("");
  const n = $("vNom").value.trim();
  if (!n) return msg(t("nomReq"));
  const { error } = await db.from("sales").insert({ shop_id: shopId, product_name: n, amount: parseFloat($("vMont").value) || 0 });
  if (error) return msg(error.message);
  $("vNom").value = $("vMont").value = "";
  chargerVen();
}
async function chargerVen(){
  const debut = new Date(); debut.setHours(0,0,0,0);
  const { data } = await db.from("sales").select("*").eq("shop_id", shopId)
    .gte("created_at", debut.toISOString()).order("created_at", { ascending: false });
  let total = 0, html = "";
  (data || []).forEach(v => {
    total += Number(v.amount);
    html += '<div class="ligne"><span>' + esc(v.product_name) + ' : ' + v.amount + ' FC</span>'
      + '<button class="small" type="button" onclick="suppr(\'sales\',\'' + v.id + '\')">' + t("suppr") + '</button></div>';
  });
  $("totVen").textContent = t("totVen") + total + " FC";
  $("listeVen").innerHTML = html || '<p class="sub">' + t("rien") + '</p>';
}

async function suppr(table, id){
  await db.from(table).delete().eq("id", id);
  chargerProd(); chargerDet(); chargerVen();
}

/* ---------- Abonnement (côté boutique) ---------- */
async function chargerAbo(){
  const r = await db.from("shops").select("id,name,status,subscription_end").eq("id", shopId).limit(1);
  if (r.data && r.data[0]) {
    SHOP = r.data[0];
    if (SHOP.status === "blocked") return afficher();
  }
  const res = await Promise.all([
    db.from("payment_numbers").select("*").order("created_at"),
    db.from("payment_requests").select("*").eq("shop_id", shopId).order("created_at", { ascending: false }).limit(10)
  ]);
  const nums = res[0].data || [], reqs = res[1].data || [];
  const j = jours(SHOP.subscription_end), ferme = shopFerme();
  const attente = reqs.some(x => x.status === "pending");
  let h = '<h3>' + t("aTitre") + '</h3><div class="blk">';
  if (j === null) h += '<span class="tag-bad">' + t("aNone") + '</span>';
  else if (j < 0) h += '<span class="tag-bad">' + t("aExp") + ' ' + esc(SHOP.subscription_end) + '</span>';
  else h += '<span class="tag-ok">' + t("aActif") + ' ' + esc(SHOP.subscription_end) + '</span><br><span class="muted">' + j + ' ' + t("aRestent") + '</span>';
  h += '</div>';
  if (ferme) h += '<div class="alerte">' + t("aFerme") + '</div>';

  h += '<h3>' + t("aPayTitre") + '</h3><p class="sub">' + t("aEtape") + '</p>';
  if (!nums.length) h += '<p class="sub">' + t("aNumNone") + '</p>';
  nums.forEach(n => {
    h += '<div class="blk"><div class="nom">' + esc(n.operator) + '</div><div>' + esc(n.phone) + '</div><div class="muted">' + esc(n.holder_name) + '</div></div>';
  });
  if (attente) {
    h += '<div class="alerte">' + t("aAttente") + '</div>';
  } else {
    h += '<label class="lb" for="aMois">' + t("aMois") + '</label><select id="aMois">'
      + [1,2,3,6,12].map(m => '<option value="' + m + '">' + m + ' ' + t("mois") + '</option>').join("") + '</select>'
      + '<label class="lb" for="aRef">' + t("aRef") + '</label><input id="aRef" maxlength="60" autocomplete="off">'
      + '<button class="main" type="button" id="aBtn" onclick="jaiPaye()">' + t("aBtn") + '</button>';
  }
  if (reqs.length) {
    h += '<h3>' + t("aHist") + '</h3>';
    const ST = { pending: "sPending", confirmed: "sConfirmed", refused: "sRefused" };
    reqs.forEach(x => {
      const cl = x.status === "confirmed" ? "tag-ok" : (x.status === "refused" ? "tag-bad" : "muted");
      h += '<div class="ligne"><span>' + esc(String(x.created_at).slice(0, 10)) + ' · ' + x.months + ' ' + t("mois") + '</span><span class="' + cl + '">' + t(ST[x.status]) + '</span></div>';
    });
  }
  $("aboBox").innerHTML = h;
  if (curTab === "abo") dessinerNav(SHOP_TABS, "abo");
}
async function jaiPaye(){
  msg("");
  $("aBtn").disabled = true;
  const { error } = await db.rpc("request_payment", { p_months: parseInt($("aMois").value, 10), p_ref: $("aRef").value.trim() });
  if (error) { $("aBtn").disabled = false; return msg(erreur(error)); }
  okm(t("aEnvoye"));
  chargerAbo();
}

/* =====================================================================
   COMPTE PROPRIÉTAIRE DUKYO
   (il ne voit ni les produits, ni les ventes, ni les dettes des boutiques)
   ===================================================================== */
async function majPending(){
  if (!document.body.classList.contains("hasnav") || $("admin").classList.contains("hidden")) return;
  const r = await db.from("payment_requests").select("id", { count: "exact", head: true }).eq("status", "pending");
  if (r.error) return;
  const n = r.count || 0;
  if (n !== pendingN) {
    pendingN = n;
    dessinerNav(ADM_TABS, admTab);
    if (admTab === "apay") renderAdmin();
  }
  document.title = (pendingN > 0 ? "(" + pendingN + ") " : "") + "Dukyo";
}
setInterval(majPending, 60000);

async function renderAdmin(){
  ADM_TABS.forEach(x => $("a_" + x[0]).classList.toggle("hidden", x[0] !== admTab));
  dessinerNav(ADM_TABS, admTab);
  if (admTab === "aabo") await admAbo();
  else if (admTab === "apay") await admPay();
  else await admMag();
}
async function chargerShopsAdmin(){
  const { data, error } = await db.from("shops").select("id,name,status,subscription_end,created_at").order("created_at");
  if (error) { msg(error.message); return []; }
  ADM_SHOPS = data || [];
  return ADM_SHOPS;
}
function etatShopHtml(s){
  if (s.status !== "active") return '<span class="tag-bad">' + t("sBlocked") + '</span>';
  const j = jours(s.subscription_end);
  if (j === null) return '<span class="tag-bad">' + t("sans") + '</span>';
  if (j < 0) return '<span class="tag-bad">' + t("aExp") + ' ' + esc(s.subscription_end) + '</span>';
  return '<span class="tag-ok">' + t("sActive") + '</span> · ' + t("fin") + ' ' + esc(s.subscription_end) + ' (' + j + ' ' + t("jU") + ')';
}
function optMois(sel, liste){
  return (liste || [1,2,3,6,12]).map(m => '<option value="' + m + '"' + (m === sel ? " selected" : "") + '>' + m + ' ' + t("mois") + '</option>').join("");
}

/* Onglet Abonnements */
async function admAbo(){
  const shops = await chargerShopsAdmin();
  let h = "";
  shops.forEach(s => {
    h += '<div class="blk"><div class="nom">' + esc(s.name) + '</div><div>' + etatShopHtml(s) + '</div>'
      + '<div class="rang"><select id="ms_' + s.id + '">' + optMois(1) + '</select>'
      + '<button class="small" type="button" onclick="prolonger(\'' + s.id + '\')">' + t("amProl") + '</button></div></div>';
  });
  $("a_aabo").innerHTML = h || '<p class="sub">' + t("rien") + '</p>';
}
async function prolonger(id){
  msg("");
  const { error } = await db.rpc("admin_extend_shop", { p_shop: id, p_months: parseInt($("ms_" + id).value, 10) });
  if (error) return msg(erreur(error));
  okm(t("fait")); admAbo();
}

/* Onglet Boutiques : bloquer / supprimer */
async function admMag(){
  const shops = await chargerShopsAdmin();
  let h = "";
  shops.forEach(s => {
    const bloque = s.status !== "active";
    h += '<div class="blk"><div class="nom">' + esc(s.name) + '</div><div>' + etatShopHtml(s) + '</div>'
      + '<div class="rang"><button class="small" type="button" onclick="basculerBlocage(\'' + s.id + '\')">' + (bloque ? t("amDebloq") : t("amBloq")) + '</button>'
      + '<button class="small danger" type="button" onclick="admSuppr(\'' + s.id + '\')">' + t("suppr") + '</button></div></div>';
  });
  $("a_amag").innerHTML = h || '<p class="sub">' + t("rien") + '</p>';
}
async function basculerBlocage(id){
  const s = ADM_SHOPS.find(x => x.id === id); if (!s) return;
  const bloque = s.status !== "active";
  if (!confirm(bloque ? t("confDebloq") : t("confBloq"))) return;
  msg("");
  const { error } = await db.rpc("admin_set_blocked", { p_shop: id, p_block: !bloque });
  if (error) return msg(erreur(error));
  okm(t("fait")); admMag();
}
async function admSuppr(id){
  const s = ADM_SHOPS.find(x => x.id === id); if (!s) return;
  const r = prompt(t("confSuppr") + "\n\n" + s.name);
  if (r === null) return;
  if (r.trim() !== s.name) return msg(t("nomPasPareil"));
  msg("");
  const { error } = await db.rpc("admin_delete_shop", { p_shop: id });
  if (error) return msg(erreur(error));
  okm(t("fait")); admMag();
}

/* Onglet Paiements : notifications + numéros */
async function admPay(){
  const res = await Promise.all([
    db.from("payment_requests").select("id,months,reference,status,granted_months,created_at,shops(name)").order("created_at", { ascending: false }).limit(40),
    db.from("payment_numbers").select("*").order("created_at")
  ]);
  const reqs = res[0].data || [], nums = res[1].data || [];
  const att = reqs.filter(x => x.status === "pending"), hist = reqs.filter(x => x.status !== "pending").slice(0, 15);
  pendingN = att.length;
  dessinerNav(ADM_TABS, "apay");
  document.title = (pendingN > 0 ? "(" + pendingN + ") " : "") + "Dukyo";
  let h = '<h3>' + t("apTitre") + '</h3>';
  if (!att.length) h += '<p class="sub">' + t("apNone") + '</p>';
  att.forEach(x => {
    h += '<div class="blk"><div class="nom">' + esc(x.shops ? x.shops.name : "?") + '</div>'
      + '<div>' + x.months + ' ' + t("mois") + ' · ' + esc(String(x.created_at).slice(0, 10)) + '</div>'
      + (x.reference ? '<div class="muted">' + t("apRef") + ' : ' + esc(x.reference) + '</div>' : '')
      + '<label class="lb" style="margin:8px 0 4px">' + t("apAccorder") + '</label>'
      + '<div class="rang"><select id="gm_' + x.id + '">' + optMois(x.months, [1,2,3,4,5,6,9,12]) + '</select></div>'
      + '<div class="rang"><button class="small" type="button" onclick="confirmerPaiement(\'' + x.id + '\')">' + t("apConf") + '</button>'
      + '<button class="small danger" type="button" onclick="refuserPaiement(\'' + x.id + '\')">' + t("apRefuse") + '</button></div></div>';
  });

  h += '<h3>' + t("apNum") + '</h3><p class="sub">' + t("apNumHelp") + '</p>';
  if (!nums.length) h += '<p class="sub">' + t("apNumNone") + '</p>';
  nums.forEach(n => {
    h += '<div class="ligne"><span><b>' + esc(n.operator) + '</b><br>' + esc(n.phone) + '<br><small>' + esc(n.holder_name) + '</small></span>'
      + '<button class="small danger" type="button" onclick="supprNumero(\'' + n.id + '\')">' + t("suppr") + '</button></div>';
  });
  h += '<label class="lb" for="nOp">' + t("apOp") + '</label><input id="nOp" maxlength="40" list="dlOp" autocomplete="off">'
    + '<datalist id="dlOp"><option value="Orange Money"><option value="Airtel Money"><option value="M-Pesa"><option value="Africell Money"></datalist>'
    + '<label class="lb" for="nTel">' + t("apNumero") + '</label><input id="nTel" type="tel" inputmode="tel" maxlength="30">'
    + '<label class="lb" for="nNom">' + t("apNom") + '</label><input id="nNom" maxlength="80">'
    + '<button class="main" type="button" onclick="ajoutNumero()">' + t("apAdd") + '</button>';

  if (hist.length) {
    h += '<h3>' + t("apHist") + '</h3>';
    hist.forEach(x => {
      const ok = x.status === "confirmed";
      h += '<div class="ligne"><span>' + esc(x.shops ? x.shops.name : "?") + '<br><small>' + esc(String(x.created_at).slice(0, 10)) + ' · ' + (ok ? x.granted_months : x.months) + ' ' + t("mois") + '</small></span>'
        + '<span class="' + (ok ? "tag-ok" : "tag-bad") + '">' + (ok ? t("sConfirmed") : t("sRefused")) + '</span></div>';
    });
  }
  $("a_apay").innerHTML = h;
}
async function confirmerPaiement(id){
  msg("");
  const { error } = await db.rpc("admin_confirm_payment", { p_id: id, p_months: parseInt($("gm_" + id).value, 10) });
  if (error) return msg(erreur(error));
  okm(t("fait")); admPay();
}
async function refuserPaiement(id){
  msg("");
  const { error } = await db.rpc("admin_refuse_payment", { p_id: id });
  if (error) return msg(erreur(error));
  okm(t("fait")); admPay();
}
async function ajoutNumero(){
  msg("");
  const op = $("nOp").value.trim(), tel = $("nTel").value.trim(), nom = $("nNom").value.trim();
  if (!op || !tel || !nom) return msg(t("apChamps"));
  const { error } = await db.from("payment_numbers").insert({ operator: op, phone: tel, holder_name: nom });
  if (error) return msg(error.message);
  okm(t("fait")); admPay();
}
async function supprNumero(id){
  msg("");
  const { error } = await db.from("payment_numbers").delete().eq("id", id);
  if (error) return msg(error.message);
  admPay();
}

/* ---------- Bienvenue ---------- */
function allerApp(){ localStorage.setItem("vu_" + shopId, "1"); afficher(); }
function ouvrirBienvenue(){
  $("app").classList.add("hidden");
  cacherNav();
  $("bienvenue").classList.remove("hidden");
}

/* ---------- Écran à afficher ---------- */
async function afficher(){
  ["auth","insc","creer","bloque","bienvenue","app","admin"].forEach(i => $(i).classList.add("hidden"));
  cacherNav();
  const s = (await db.auth.getSession()).data.session;
  if (!s) { $("auth").classList.remove("hidden"); return; }
  const a = await db.rpc("is_admin");
  if (a.data === true) {
    $("admin").classList.remove("hidden");
    await renderAdmin();
    majPending();
    return;
  }
  const r = await db.from("shops").select("id,name,status,subscription_end").eq("owner_id", s.user.id).limit(1);
  if (r.error) { msg(r.error.message); $("auth").classList.remove("hidden"); return; }
  if (r.data.length === 0) { $("creer").classList.remove("hidden"); return; }
  SHOP = r.data[0]; shopId = SHOP.id; shopNom = SHOP.name;
  $("titre").textContent = shopNom; $("wNom").textContent = shopNom;
  if (SHOP.status === "blocked") { $("bloque").classList.remove("hidden"); return; }
  if (!localStorage.getItem("vu_" + shopId)) { $("bienvenue").classList.remove("hidden"); return; }
  $("app").classList.remove("hidden");
  chargerProd(); chargerDet(); chargerVen();
  onglet(curTab);
}

langue(L);
initFond();
afficher();
</script>
