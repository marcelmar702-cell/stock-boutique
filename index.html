<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukyo</title>
<style>
:root{--bg:#e9f1f7;--bg2:#d8e7f1;--card:rgba(255,255,255,.82);--champ:#fff;--txt:#1b2430;--doux:#5b6878;--bord:#cfd8e3;--w1:rgba(30,99,214,.13);--w2:rgba(31,157,107,.13);--w3:rgba(14,116,144,.12)}
:root[data-theme="dark"]{--bg:#0e1419;--bg2:#0a1015;--card:rgba(29,36,45,.82);--champ:#151b22;--txt:#e8edf3;--doux:#9aa7b7;--bord:#3a4553;--w1:rgba(46,120,230,.16);--w2:rgba(40,175,125,.14);--w3:rgba(30,150,180,.14)}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;max-width:460px;margin:0 auto;padding:14px;background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--txt);min-height:100vh;animation:apparait 2s ease both;transition:background .4s,color .4s}
@keyframes apparait{from{opacity:0}to{opacity:1}}

/* Fond : vagues d'eau douces */
.fond{position:fixed;inset:0;overflow:hidden;z-index:-1}
.vg{position:absolute;left:0;bottom:0;width:100%;overflow:hidden;animation:houle 9s ease-in-out infinite alternate}
.vg svg{display:block;width:200%;height:100%;animation:glisse 28s linear infinite}
@keyframes glisse{to{transform:translateX(-50%)}}
@keyframes houle{from{transform:translateY(0)}to{transform:translateY(16px)}}
.v1{height:55vh}.v1 .p{fill:var(--w1)}
.v2{height:44vh;animation-duration:12s;animation-delay:-4s}.v2 svg{animation-duration:38s;animation-direction:reverse}.v2 .p{fill:var(--w2)}
.v3{height:33vh;animation-duration:10s;animation-delay:-7s}.v3 svg{animation-duration:23s}.v3 .p{fill:var(--w3)}

/* Barre du haut */
.haut{display:flex;justify-content:space-between;margin-bottom:6px}
.sw{position:relative;display:flex;width:80px;height:34px;border-radius:20px;background:var(--card);border:1px solid var(--bord);cursor:pointer;backdrop-filter:blur(8px);user-select:none;overflow:hidden;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.sw:active{transform:scale(.92)}
.sw span{flex:1;text-align:center;line-height:32px;font-size:13px;z-index:1}
.sw .knob{position:absolute;top:3px;left:3px;width:36px;height:26px;border-radius:15px;background:rgba(30,99,214,.28);transition:transform .45s cubic-bezier(.4,1.4,.5,1)}
.sw.b .knob{transform:translateX(37px)}

/* Titre Dukyo : bleu et vert, reflet très doux */
.logo{font-size:46px;font-weight:800;letter-spacing:1px;text-align:center;margin:4px 0;
 background-image:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.45) 50%,transparent 58%),linear-gradient(90deg,#1e63d6 0 58%,#1f9d6b 58% 100%);
 background-size:250% 100%,100% 100%;background-repeat:no-repeat;
 -webkit-background-clip:text;background-clip:text;color:transparent;
 animation:brille 7s ease-in-out infinite,descend 1s ease both}
@keyframes brille{0%{background-position:160% 0,0 0}100%{background-position:-60% 0,0 0}}
@keyframes descend{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.slogan{text-align:center;color:var(--doux);font-size:14px;margin:0 0 12px}

/* Cartes, champs, boutons */
.box{background:var(--card);backdrop-filter:blur(10px);padding:14px;border-radius:16px;margin-bottom:12px;box-shadow:0 6px 24px rgba(0,0,0,.08);animation:entree .7s ease both}
@keyframes entree{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.lb{display:block;font-size:12px;color:var(--doux);margin:8px 0 2px}
input{width:100%;padding:11px;font-size:16px;border-radius:10px;border:1px solid var(--bord);background:var(--champ);color:var(--txt);transition:border-color .3s,box-shadow .3s,transform .3s}
input:focus{outline:0;border-color:#1e63d6;box-shadow:0 0 0 4px rgba(30,99,214,.16);transform:translateY(-2px)}
button{position:relative;overflow:hidden;width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:10px;border:0;background:#1e63d6;color:#fff;transition:transform .45s cubic-bezier(.34,1.56,.64,1),filter .3s,box-shadow .3s}
button:active{transform:scale(.93);filter:brightness(.9)}
button.alt{background:#1f9d6b}
button.gris{background:#6b7684}
button.petit{width:auto;padding:6px 10px;margin:0 0 0 6px;font-size:13px}
.onde{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:onde .8s ease-out forwards;pointer-events:none}
@keyframes onde{to{transform:scale(1);opacity:0}}
#msg{color:#e03030;text-align:center;min-height:18px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{margin:0;background:var(--card);color:var(--txt);border:1px solid var(--bord);font-size:14px;padding:10px 4px}
.tab.on{background:#1e63d6;color:#fff;border-color:#1e63d6}
.entete{display:flex;justify-content:space-between;align-items:center}
.entete h2{margin:6px 0}
.aide{width:34px;height:34px;padding:0;border-radius:50%;margin:0;font-size:16px}
.ligne{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bord);animation:entree .5s ease both}
.rouge{color:#e03030;font-weight:bold}.orange{color:#b7791f;font-weight:bold}.vert{color:#2a9d4a}
.alerte{background:rgba(183,121,31,.14);border-radius:10px;padding:8px;margin:8px 0;font-size:14px}
.etape{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bord);animation:entree .7s ease both}
.etape:nth-child(2){animation-delay:.15s}.etape:nth-child(3){animation-delay:.3s}.etape:nth-child(4){animation-delay:.45s}
.etape .ico{font-size:24px}
.etape b{font-size:15px}.etape p{margin:2px 0 0;font-size:13px;color:var(--doux)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="fond">
  <div class="vg v1"><svg viewBox="0 0 2400 200" preserveAspectRatio="none"><path class="p" d="M0 100 Q300 20 600 100 T1200 100 T1800 100 T2400 100 V200 H0Z"/></svg></div>
  <div class="vg v2"><svg viewBox="0 0 2400 200" preserveAspectRatio="none"><path class="p" d="M0 100 Q300 20 600 100 T1200 100 T1800 100 T2400 100 V200 H0Z"/></svg></div>
  <div class="vg v3"><svg viewBox="0 0 2400 200" preserveAspectRatio="none"><path class="p" d="M0 100 Q300 20 600 100 T1200 100 T1800 100 T2400 100 V200 H0Z"/></svg></div>
  <div id="bulles" style="display:none"></div>
</div>
<script>
document.addEventListener("pointerdown", function(e){
  var b = e.target.closest("button,.sw");
  if (!b) return;
  var r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2;
  var d = document.createElement("span");
  d.className = "onde";
  d.style.cssText = "width:"+s+"px;height:"+s+"px;left:"+(e.clientX-r.left-s/2)+"px;top:"+(e.clientY-r.top-s/2)+"px";
  b.appendChild(d);
  setTimeout(function(){ d.remove(); }, 800);
});
</script>
<div class="haut">
  <div class="sw" id="swLang" onclick="basculeLang()"><span>FR</span><span>SW</span><i class="knob"></i></div>
  <div class="sw" id="swTh" onclick="theme()"><span>☀️</span><span>🌙</span><i class="knob"></i></div>
</div>
<h1 class="logo">Dukyo</h1>
<p class="slogan" data-t="slogan"></p>
<div id="msg"></div>

<div id="auth" class="box" style="display:none">
  <label class="lb" for="email" data-t="lEmail"></label>
  <input id="email" type="email" autocomplete="email">
  <label class="lb" for="pass" data-t="lPass"></label>
  <input id="pass" type="password" autocomplete="current-password">
  <button onclick="connecter()" data-t="login"></button>
  <button class="alt" onclick="inscrire()" data-t="signup"></button>
</div>

<div id="creer" class="box" style="display:none">
  <label class="lb" for="nomMagasin" data-t="lNomMag"></label>
  <input id="nomMagasin">
  <button onclick="creerMagasin()" data-t="creerMag"></button>
  <button class="gris" onclick="sortir()" data-t="logout"></button>
</div>

<div id="bienvenue" style="display:none">
  <div class="box">
    <h2><span data-t="karibu"></span> <span id="wNom"></span> !</h2>
    <p class="slogan" style="text-align:left" data-t="wIntro"></p>
    <div class="etape"><span class="ico">📦</span><div><b data-t="w1t"></b><p data-t="w1d"></p></div></div>
    <div class="etape"><span class="ico">📒</span><div><b data-t="w2t"></b><p data-t="w2d"></p></div></div>
    <div class="etape"><span class="ico">💰</span><div><b data-t="w3t"></b><p data-t="w3d"></p></div></div>
    <div class="etape"><span class="ico">📈</span><div><b data-t="w4t"></b><p data-t="w4d"></p></div></div>
    <button onclick="allerApp()" data-t="commencer"></button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="entete"><h2 id="titre"></h2><button class="aide" onclick="ouvrirBienvenue()">?</button></div>
  <div class="tabs">
    <button class="tab on" id="tProd" onclick="onglet('pProd')" data-t="produits"></button>
    <button class="tab" id="tDet" onclick="onglet('pDet')" data-t="dettes"></button>
    <button class="tab" id="tVen" onclick="onglet('pVen')" data-t="ventes"></button>
  </div>

  <div id="pProd" class="box">
    <label class="lb" for="pNom" data-t="lProd"></label><input id="pNom">
    <label class="lb" for="pQte" data-t="lQte"></label><input id="pQte" type="number" inputmode="numeric">
    <label class="lb" for="pDate" data-t="lDateExp"></label><input id="pDate" type="date">
    <button onclick="ajoutProd()" data-t="ajouter"></button>
    <div id="alerteProd"></div>
    <div id="listeProd"></div>
  </div>

  <div id="pDet" class="box" style="display:none">
    <label class="lb" for="dNom" data-t="lClient"></label><input id="dNom">
    <label class="lb" for="dMont" data-t="lMontant"></label><input id="dMont" type="number" inputmode="decimal">
    <button onclick="ajoutDette()" data-t="ajouter"></button>
    <p><b id="totDet"></b></p>
    <div id="listeDet"></div>
  </div>

  <div id="pVen" class="box" style="display:none">
    <label class="lb" for="vNom" data-t="lProd"></label><input id="vNom">
    <label class="lb" for="vMont" data-t="lMontant"></label><input id="vMont" type="number" inputmode="decimal">
    <button onclick="ajoutVente()" data-t="ajouter"></button>
    <p><b id="totVen"></b></p>
    <div id="listeVen"></div>
  </div>
  <button class="gris" onclick="sortir()" data-t="logout"></button>
</div>

<div id="admin" class="box" style="display:none">
  <h2 data-t="adminTitre"></h2>
  <div id="listeAdmin"></div>
  <button class="gris" onclick="sortir()" data-t="logout"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient(
  "https://jvocjjrjfioqwxfzplnb.supabase.co",
  "sb_publishable_imOLQTOIvhydb7Z4PjmjSw_CijN4k7W"
);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let shopId = null, shopNom = "";

const T = {
fr:{slogan:"Gère mieux ta boutique. Développe-la plus.",
 lEmail:"Écris ici ton email",lPass:"Écris ton mot de passe (6 caractères minimum)",
 login:"Se connecter",signup:"Créer mon compte",
 lNomMag:"Écris le nom de ta boutique",creerMag:"Créer ma boutique",logout:"Se déconnecter",
 nomReq:"Écris le nom.",
 karibu:"Bienvenue",wIntro:"Voici ce que tu peux faire avec Dukyo :",
 w1t:"Produits",w1d:"Écris chaque produit avec sa date d’expiration. Dukyo te montre ceux qui bientôt expirent, pour ne rien perdre.",
 w2t:"Dettes",w2d:"Note les clients qui prennent à crédit et le montant. Touche « Payé » quand ils paient.",
 w3t:"Ventes",w3d:"Note chaque vente du jour. Tu vois le total d’aujourd’hui.",
 w4t:"Bénéfices et évolution",w4d:"Voir combien tu gagnes et comment ta boutique avance : bientôt disponible.",
 commencer:"Commencer",
 produits:"Produits",dettes:"Dettes",ventes:"Ventes",
 lProd:"Nom du produit",lQte:"Quantité",lDateExp:"Date d’expiration",ajouter:"Ajouter",
 lClient:"Nom du client",lMontant:"Montant (FC)",
 expire:"Expiré",jours:"jours restants",suppr:"Supprimer",paye:"Payé",
 totDet:"Total des dettes pas encore payées : ",totVen:"Total des ventes d’aujourd’hui : ",
 adminTitre:"Dukyo : toutes les boutiques",
 alerte:"⚠️ Produits qui expirent dans 30 jours ou moins : ",rien:"Rien pour l’instant.",
 prodN:"produits",detN:"dettes pas payées"},
sw:{slogan:"Simamia boutique yako vizuri. Pata faida mingi.",
 lEmail:"Weka hapa mail yako",lPass:"Weka password yako (angalau 6 caractères)",
 login:"Ingia",signup:"Fungua compte yako",
 lNomMag:"Andika jina ya boutique yako",creerMag:"Fungua boutique yangu",logout:"Toka",
 nomReq:"Andika jina.",
 karibu:"Karibu",wIntro:"Hii ndiyo unaweza kufanya na Dukyo :",
 w1t:"Produits",w1d:"Andika kila produit na date ya expiration. Dukyo inakuonyesha zile zinakaribia kuisha, usipoteze marchandise.",
 w2t:"Dettes",w2d:"Andika wateja wanaokopa na kiasi chao. Bonyeza « Amelipa » akishalipa.",
 w3t:"Ventes",w3d:"Andika kila vente ya siku. Utaona jumla ya leo.",
 w4t:"Faida na maendeleo",w4d:"Kuona unapata kiasi gani na boutique yako inaendeleaje : inakuja bientôt.",
 commencer:"Anza",
 produits:"Produits",dettes:"Dettes",ventes:"Ventes",
 lProd:"Jina ya produit",lQte:"Idadi",lDateExp:"Date ya expiration",ajouter:"Ongeza",
 lClient:"Jina ya client",lMontant:"Kiasi (FC)",
 expire:"Imeisha",jours:"siku zimebaki",suppr:"Futa",paye:"Amelipa",
 totDet:"Jumla ya dettes bado hazijalipwa : ",totVen:"Jumla ya ventes ya leo : ",
 adminTitre:"Dukyo : boutiques zote",
 alerte:"⚠️ Produits zinakaribia kuisha (siku 30 au chini) : ",rien:"Hakuna bado.",
 prodN:"produits",detN:"dettes hazijalipwa"}
};
let L = localStorage.getItem("lang") || "fr";
const t = k => T[L][k];

function langue(l){
  L = l; localStorage.setItem("lang", l);
  document.documentElement.lang = l === "sw" ? "sw" : "fr";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[l][e.dataset.t]);
  $("swLang").classList.toggle("b", l === "sw");
}
function basculeLang(){ langue(L === "fr" ? "sw" : "fr"); afficher(); }

function appliquerTheme(nv){
  document.documentElement.dataset.theme = nv;
  $("swTh").classList.toggle("b", nv === "dark");
}
function theme(){
  const cur = document.documentElement.dataset.theme;
  const nv = cur === "dark" ? "light" : "dark";
  localStorage.setItem("theme", nv);
  appliquerTheme(nv);
}
appliquerTheme(localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

(function bulles(){
  const f = $("bulles");
  for (let i = 0; i < 10; i++) {
    const b = document.createElement("i");
    const s = 10 + Math.random() * 30;
    b.style.cssText = "width:" + s + "px;height:" + s + "px;left:" + (Math.random() * 100) + "%;animation-duration:" + (14 + Math.random() * 14) + "s;animation-delay:-" + (Math.random() * 20) + "s";
    f.appendChild(b);
  }
})();

function msg(m){ $("msg").textContent = m || ""; }
function onglet(id){
  ["pProd","pDet","pVen"].forEach(p => $(p).style.display = p === id ? "block" : "none");
  const map = { pProd:"tProd", pDet:"tDet", pVen:"tVen" };
  Object.keys(map).forEach(p => $(map[p]).classList.toggle("on", p === id));
}

async function inscrire(){
  msg("");
  const { error } = await db.auth.signUp({ email: $("email").value, password: $("pass").value });
  if (error) return msg(error.message);
  afficher();
}
async function connecter(){
  msg("");
  const { error } = await db.auth.signInWithPassword({ email: $("email").value, password: $("pass").value });
  if (error) return msg(error.message);
  afficher();
}
async function sortir(){ await db.auth.signOut(); afficher(); }

async function creerMagasin(){
  msg("");
  const nom = $("nomMagasin").value.trim();
  if (!nom) return msg(t("nomReq"));
  const { error } = await db.from("shops").insert({ name: nom });
  if (error) return msg(error.message);
  afficher();
}

/* ---------- Produits ---------- */
async function ajoutProd(){
  msg("");
  const name = $("pNom").value.trim();
  if (!name) return msg(t("nomReq"));
  const { error } = await db.from("products").insert({
    shop_id: shopId, name, quantity: parseInt($("pQte").value) || 0, expiry_date: $("pDate").value || null });
  if (error) return msg(error.message);
  $("pNom").value = $("pQte").value = $("pDate").value = "";
  chargerProd();
}
async function chargerProd(){
  const { data } = await db.from("products").select("*").eq("shop_id", shopId)
    .order("expiry_date", { ascending: true, nullsFirst: false });
  const auj = new Date(); auj.setHours(0,0,0,0);
  let proches = 0, html = "";
  (data || []).forEach(p => {
    let etat = "", cls = "";
    if (p.expiry_date) {
      const j = Math.round((new Date(p.expiry_date + "T00:00:00") - auj) / 864e5);
      if (j < 0) { etat = t("expire"); cls = "rouge"; proches++; }
      else { etat = j + " " + t("jours"); if (j <= 30) { cls = "orange"; proches++; } }
    }
    html += '<div class="ligne"><span>' + esc(p.name) + ' (' + p.quantity + ')<br><small class="' + cls + '">'
      + esc(p.expiry_date || "") + ' ' + etat + '</small></span>'
      + '<button class="petit gris" onclick="suppr(\'products\',\'' + p.id + '\')">' + t("suppr") + '</button></div>';
  });
  $("alerteProd").innerHTML = proches ? '<div class="alerte">' + t("alerte") + proches + '</div>' : "";
  $("listeProd").innerHTML = html || t("rien");
}

/* ---------- Dettes ---------- */
async function ajoutDette(){
  msg("");
  const c = $("dNom").value.trim();
  if (!c) return msg(t("nomReq"));
  const { error } = await db.from("debts").insert({ shop_id: shopId, customer_name: c, amount: parseFloat($("dMont").value) || 0 });
  if (error) return msg(error.message);
  $("dNom").value = $("dMont").value = "";
  chargerDet();
}
async function payer(id){ await db.from("debts").update({ paid: true }).eq("id", id); chargerDet(); }
async function chargerDet(){
  const { data } = await db.from("debts").select("*").eq("shop_id", shopId).order("created_at", { ascending: false });
  let total = 0, html = "";
  (data || []).forEach(d => {
    if (!d.paid) total += Number(d.amount);
    html += '<div class="ligne"><span class="' + (d.paid ? "vert" : "") + '">' + esc(d.customer_name) + ' : ' + d.amount + ' FC</span><span>'
      + (d.paid ? "✔" : '<button class="petit" onclick="payer(\'' + d.id + '\')">' + t("paye") + '</button>')
      + '<button class="petit gris" onclick="suppr(\'debts\',\'' + d.id + '\')">' + t("suppr") + '</button></span></div>';
  });
  $("totDet").textContent = t("totDet") + total + " FC";
  $("listeDet").innerHTML = html || t("rien");
}

/* ---------- Ventes ---------- */
async function ajoutVente(){
  msg("");
  const n = $("vNom").value.trim();
  if (!n) return msg(t("nomReq"));
  const { error } = await db.from("sales").insert({ shop_id: shopId, product_name: n, amount: parseFloat($("vMont").value) || 0 });
  if (error) return msg(error.message);
  $("vNom").value = $("vMont").value = "";
  chargerVen();
}
async function chargerVen(){
  const debut = new Date(); debut.setHours(0,0,0,0);
  const { data } = await db.from("sales").select("*").eq("shop_id", shopId)
    .gte("created_at", debut.toISOString()).order("created_at", { ascending: false });
  let total = 0, html = "";
  (data || []).forEach(v => {
    total += Number(v.amount);
    html += '<div class="ligne"><span>' + esc(v.product_name) + ' : ' + v.amount + ' FC</span>'
      + '<button class="petit gris" onclick="suppr(\'sales\',\'' + v.id + '\')">' + t("suppr") + '</button></div>';
  });
  $("totVen").textContent = t("totVen") + total + " FC";
  $("listeVen").innerHTML = html || t("rien");
}

async function suppr(table, id){
  await db.from(table).delete().eq("id", id);
  chargerProd(); chargerDet(); chargerVen();
}

/* ---------- Propriétaire Dukyo ---------- */
async function chargerAdmin(){
  const { data: shops } = await db.from("shops").select("id,name").order("created_at");
  const { data: prods } = await db.from("products").select("shop_id");
  const { data: dets } = await db.from("debts").select("shop_id").eq("paid", false);
  let html = "";
  (shops || []).forEach(s => {
    const np = (prods || []).filter(x => x.shop_id === s.id).length;
    const nd = (dets || []).filter(x => x.shop_id === s.id).length;
    html += '<div class="ligne"><span>' + esc(s.name) + '</span><small>' + np + ' ' + t("prodN") + ', ' + nd + ' ' + t("detN") + '</small></div>';
  });
  $("listeAdmin").innerHTML = html || t("rien");
}

/* ---------- Bienvenue ---------- */
function allerApp(){ localStorage.setItem("vu_" + shopId, "1"); afficher(); }
function ouvrirBienvenue(){
  $("app").style.display = "none";
  $("bienvenue").style.display = "block";
}

async function afficher(){
  ["auth","creer","bienvenue","app","admin"].forEach(i => $(i).style.display = "none");
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $("auth").style.display = "block"; return; }
  const { data: estAdmin } = await db.rpc("is_admin");
  if (estAdmin === true) { $("admin").style.display = "block"; chargerAdmin(); return; }
  const { data, error } = await db.from("shops").select("id,name").eq("owner_id", session.user.id).limit(1);
  if (error) { msg(error.message); $("auth").style.display = "block"; return; }
  if (data.length === 0) { $("creer").style.display = "block"; return; }
  shopId = data[0].id; shopNom = data[0].name;
  $("titre").textContent = shopNom;
  $("wNom").textContent = shopNom;
  if (!localStorage.getItem("vu_" + shopId)) { $("bienvenue").style.display = "block"; return; }
  $("app").style.display = "block";
  chargerProd(); chargerDet(); chargerVen();
}
langue(L);
afficher();
</script>
