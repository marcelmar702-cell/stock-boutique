<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukyo</title>
<style>
:root{--bg1:#eaf1fb;--bg2:#fdf3e7;--card:rgba(255,255,255,.86);--inp:#fff;--txt:#1b2430;--bord:#c9d3e0}
:root[data-theme="dark"]{--bg1:#0d1219;--bg2:#1a1410;--card:rgba(29,36,45,.88);--inp:#141a21;--txt:#e8edf3;--bord:#3a4553}
*{-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;max-width:460px;margin:0 auto;padding:16px;color:var(--txt);
 min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));background-size:200% 200%;animation:fond 14s ease infinite;position:relative;overflow-x:hidden}
@keyframes fond{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0;pointer-events:none}
body::before{width:240px;height:240px;background:#1e63d6;top:-60px;left:-80px;animation:flotte 9s ease-in-out infinite}
body::after{width:220px;height:220px;background:#f58220;bottom:-60px;right:-70px;animation:flotte 11s ease-in-out infinite reverse}
@keyframes flotte{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
body>*{position:relative;z-index:1}
.haut{display:flex;justify-content:space-between;align-items:center}
.sw{position:relative;display:flex;align-items:center;justify-content:space-between;width:74px;height:36px;padding:0 9px;border-radius:20px;background:var(--card);border:1px solid var(--bord);cursor:pointer;margin:0;font-size:13px;font-weight:700;color:var(--txt)}
.sw i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ffd76a,#f58220);box-shadow:0 0 10px #ffb84a99;transition:transform .35s cubic-bezier(.5,1.6,.5,1)}
.sw span{position:relative;z-index:1}
html[data-theme="dark"] #swTh i{transform:translateX(38px)}
html[data-l="sw"] #swLg i{transform:translateX(38px)}
.logoWrap{position:relative;text-align:center;margin:14px 0 4px}
.logo{display:inline-block;font-size:48px;font-weight:900;letter-spacing:2px;
 background:linear-gradient(110deg,#1e63d6 0%,#1e63d6 34%,#ffd76a 46%,#fffbe0 50%,#ffd76a 54%,#f58220 66%,#f58220 100%);
 background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 animation:brille 3.6s linear infinite;filter:drop-shadow(0 0 8px rgba(255,190,70,.45))}
@keyframes brille{0%{background-position:150% 0}100%{background-position:-60% 0}}
.star{position:absolute;color:#ffd76a;font-size:14px;animation:scint 2.4s ease-in-out infinite;opacity:0}
.s1{left:22%;top:4px}.s2{right:20%;top:30px;animation-delay:.8s}.s3{left:46%;top:-6px;animation-delay:1.5s}
@keyframes scint{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(90deg)}}
.slogan{text-align:center;margin:0 0 12px;opacity:.85}
label{display:block;font-size:12px;opacity:.75;margin:8px 0 0}
input,button{width:100%;padding:12px;margin:4px 0;font-size:16px;box-sizing:border-box;border-radius:10px;border:1px solid var(--bord)}
input{background:var(--inp);color:var(--txt);transition:box-shadow .2s,border-color .2s}
input:focus{outline:none;border-color:#1e63d6;box-shadow:0 0 0 3px #1e63d644}
button{background:linear-gradient(135deg,#1e63d6,#3b82f6);color:#fff;border:0;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s}
button:hover{box-shadow:0 4px 14px #1e63d655}
button:active{transform:scale(.96)}
button.alt{background:linear-gradient(135deg,#f58220,#ffb347)}
button.gris{background:#777}
button.petit{width:auto;padding:6px 10px;margin:0 0 0 6px;font-size:14px}
#msg{color:#e03030;text-align:center;min-height:20px}
.box{background:var(--card);backdrop-filter:blur(8px);padding:14px;border-radius:16px;margin-bottom:12px;box-shadow:0 6px 24px #0000001f;animation:monte .5s ease both}
@keyframes monte{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;margin:0;background:var(--card);color:var(--txt);border:1px solid var(--bord)}
.tabs button.on{background:linear-gradient(135deg,#1e63d6,#3b82f6);color:#fff}
.ligne{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bord);animation:glisse .35s ease both}
@keyframes glisse{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.rouge{color:#e03030;font-weight:bold}
.orange{color:#f58220;font-weight:bold}
.vert{color:#2a9d4a}
.alerte{background:#f5822033;border-radius:10px;padding:8px;margin:8px 0}
.etape{display:flex;gap:10px;padding:8px 0;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="haut">
  <button class="sw" id="swLg" onclick="basculer()"><span>FR</span><span>SW</span><i></i></button>
  <button class="sw" id="swTh" onclick="theme()"><span>☀️</span><span>🌙</span><i></i></button>
</div>
<div class="logoWrap">
  <span class="star s1">✦</span><span class="star s2">✦</span><span class="star s3">✦</span>
  <div class="logo">Dukyo</div>
</div>
<p class="slogan" data-t="slogan"></p>
<div id="msg"></div>

<div id="auth" class="box" style="display:none">
  <label data-t="lEmail"></label>
  <input id="email" type="email">
  <label data-t="lPass"></label>
  <input id="pass" type="password">
  <button onclick="connecter()" data-t="login"></button>
  <button class="alt" onclick="inscrire()" data-t="signup"></button>
</div>

<div id="creer" class="box" style="display:none">
  <label data-t="lNomMag"></label>
  <input id="nomMagasin">
  <button onclick="creerMagasin()" data-t="creerMag"></button>
  <button class="gris" onclick="sortir()" data-t="logout"></button>
</div>

<div id="bienv" class="box" style="display:none">
  <h2 data-t="bTitre"></h2>
  <p data-t="bTexte"></p>
  <div class="etape"><span>📦</span><span data-t="b1"></span></div>
  <div class="etape"><span>📒</span><span data-t="b2"></span></div>
  <div class="etape"><span>💰</span><span data-t="b3"></span></div>
  <div class="etape"><span>🚀</span><span data-t="b4"></span></div>
  <button onclick="commencer()" data-t="bBtn"></button>
</div>

<div id="app" style="display:none">
  <h2 id="titre"></h2>
  <div class="tabs">
    <button id="tProd" class="on" onclick="onglet('pProd')" data-t="produits"></button>
    <button id="tDet" onclick="onglet('pDet')" data-t="dettes"></button>
    <button id="tVen" onclick="onglet('pVen')" data-t="ventes"></button>
  </div>

  <div id="pProd" class="box">
    <label data-t="nomProd"></label><input id="pNom">
    <label data-t="qte"></label><input id="pQte" type="number">
    <label data-t="dateExp"></label><input id="pDate" type="date">
    <button onclick="ajoutProd()" data-t="ajouter"></button>
    <div id="alerteProd"></div>
    <div id="listeProd"></div>
  </div>

  <div id="pDet" class="box" style="display:none">
    <label data-t="client"></label><input id="dNom">
    <label data-t="montant"></label><input id="dMont" type="number">
    <button onclick="ajoutDette()" data-t="ajouter"></button>
    <p><b id="totDet"></b></p>
    <div id="listeDet"></div>
  </div>

  <div id="pVen" class="box" style="display:none">
    <label data-t="nomProd"></label><input id="vNom">
    <label data-t="montant"></label><input id="vMont" type="number">
    <button onclick="ajoutVente()" data-t="ajouter"></button>
    <p><b id="totVen"></b></p>
    <div id="listeVen"></div>
  </div>
  <button class="gris" onclick="sortir()" data-t="logout"></button>
</div>

<div id="admin" class="box" style="display:none">
  <h2 data-t="adminTitre"></h2>
  <div id="listeAdmin"></div>
  <button class="gris" onclick="sortir()" data-t="logout"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient(
  "https://jvocjjrjfioqwxfzplnb.supabase.co",
  "sb_publishable_imOLQTOIvhydb7Z4PjmjSw_CijN4k7W"
);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let shopId = null;

const T = {
fr:{slogan:"Gérez mieux. Développez plus.",lEmail:"Écris ici ton email",lPass:"Écris ton mot de passe (6 caractères minimum)",
 login:"Se connecter",signup:"Créer mon compte",lNomMag:"Écris ici le nom de ton magasin",
 creerMag:"Créer mon magasin",logout:"Se déconnecter",nomReq:"Écris le nom.",
 bTitre:"Bienvenue sur Dukyo !",bTexte:"Ton magasin est prêt. Voici ce que Dukyo fait pour toi :",
 b1:"Produits : écris tes produits avec la date d’expiration. Dukyo te prévient avant qu’ils se gâtent.",
 b2:"Dettes : écris les clients qui prennent à crédit, et marque « Payé » quand ils remboursent.",
 b3:"Ventes : écris tout ce que tu vends aujourd’hui et vois le total.",
 b4:"Bientôt : bénéfices, évolution de ton magasin et notifications.",bBtn:"Commencer",
 produits:"Produits",dettes:"Dettes",ventes:"Ventes",nomProd:"Nom du produit",qte:"Quantité",
 dateExp:"Date d’expiration",ajouter:"Ajouter",client:"Nom du client",montant:"Montant (FC)",
 expire:"Expiré",jours:"j restants",suppr:"Supprimer",paye:"Payé",totDet:"Total des dettes impayées : ",
 totVen:"Total des ventes d’aujourd’hui : ",adminTitre:"Dukyo : tous les magasins",
 alerte:"⚠️ Produits qui expirent dans 30 jours ou moins : ",rien:"Rien pour l’instant.",
 prodN:"produits",detN:"dettes impayées"},
sw:{slogan:"Simamia vizuri, kua zaidi.",lEmail:"Weka hapa mail yako",lPass:"Weka password yako (neno ya siri), angalau 6",
 login:"Ingia",signup:"Fungua compte yako",lNomMag:"Andika hapa jina ya boutique yako",
 creerMag:"Tengeneza boutique yangu",logout:"Toka",nomReq:"Andika jina.",
 bTitre:"Karibu kwa Dukyo !",bTexte:"Boutique yako iko tayari. Hii ndiyo kazi ya Dukyo kwako :",
 b1:"Bidhaa : andika bidhaa zako na date ya expiration. Dukyo inakuonya kabla ziharibike.",
 b2:"Madeni : andika clients wanaokopa, na weka alama « Amelipa » wakilipa.",
 b3:"Mauzo : andika kila kitu unachouza leo, uone total.",
 b4:"Karibuni : bénéfices, maendeleo ya boutique yako na notifications.",bBtn:"Anza sasa",
 produits:"Bidhaa",dettes:"Madeni",ventes:"Mauzo",nomProd:"Jina ya bidhaa",qte:"Idadi",
 dateExp:"Date ya expiration",ajouter:"Ongeza",client:"Jina ya client",montant:"Montant (FC)",
 expire:"Imeisha (expiré)",jours:"siku zimebaki",suppr:"Futa",paye:"Amelipa",totDet:"Total ya madeni haijalipwa : ",
 totVen:"Total ya mauzo ya leo : ",adminTitre:"Dukyo : boutiques zote",
 alerte:"⚠️ Bidhaa zinakaribia expiration (siku 30 au chini) : ",rien:"Hakuna kitu bado.",
 prodN:"bidhaa",detN:"madeni haijalipwa"}
};
let L = localStorage.getItem("lang") || "fr";
const t = k => T[L][k];

function langue(l){
  L = l; localStorage.setItem("lang", l);
  document.documentElement.lang = l;
  document.documentElement.dataset.l = l;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[l][e.dataset.t]);
}
function basculer(){ langue(L === "fr" ? "sw" : "fr"); afficher(); }
function theme(){
  const nv = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nv;
  localStorage.setItem("theme", nv);
}
document.documentElement.dataset.theme = localStorage.getItem("theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

function msg(m){ $("msg").textContent = m || ""; }
function onglet(id){
  const map = { pProd:"tProd", pDet:"tDet", pVen:"tVen" };
  Object.keys(map).forEach(p => {
    $(p).style.display = p === id ? "block" : "none";
    $(map[p]).className = p === id ? "on" : "";
  });
}

async function inscrire(){
  msg("");
  const { error } = await db.auth.signUp({ email: $("email").value, password: $("pass").value });
  if (error) return msg(error.message);
  afficher();
}
async function connecter(){
  msg("");
  const { error } = await db.auth.signInWithPassword({ email: $("email").value, password: $("pass").value });
  if (error) return msg(error.message);
  afficher();
}
async function sortir(){ await db.auth.signOut(); afficher(); }

async function creerMagasin(){
  msg("");
  const nom = $("nomMagasin").value.trim();
  if (!nom) return msg(t("nomReq"));
  const { error } = await db.from("shops").insert({ name: nom });
  if (error) return msg(error.message);
  localStorage.setItem("welcome", "1");
  afficher();
}
function commencer(){ localStorage.removeItem("welcome"); afficher(); }

/* ---------- Produits ---------- */
async function ajoutProd(){
  msg("");
  const name = $("pNom").value.trim();
  if (!name) return msg(t("nomReq"));
  const { error } = await db.from("products").insert({
    shop_id: shopId, name, quantity: parseInt($("pQte").value) || 0, expiry_date: $("pDate").value || null });
  if (error) return msg(error.message);
  $("pNom").value = $("pQte").value = $("pDate").value = "";
  chargerProd();
}
async function chargerProd(){
  const { data } = await db.from("products").select("*").eq("shop_id", shopId)
    .order("expiry_date", { ascending: true, nullsFirst: false });
  const auj = new Date(); auj.setHours(0,0,0,0);
  let proches = 0, html = "";
  (data || []).forEach(p => {
    let etat = "", cls = "";
    if (p.expiry_date) {
      const j = Math.round((new Date(p.expiry_date + "T00:00:00") - auj) / 864e5);
      if (j < 0) { etat = t("expire"); cls = "rouge"; proches++; }
      else { etat = j + " " + t("jours"); if (j <= 30) { cls = "orange"; proches++; } }
    }
    html += '<div class="ligne"><span>' + esc(p.name) + ' (' + p.quantity + ')<br><small class="' + cls + '">'
      + esc(p.expiry_date || "") + ' ' + etat + '</small></span>'
      + '<button class="petit gris" onclick="suppr(\'products\',\'' + p.id + '\')">' + t("suppr") + '</button></div>';
  });
  $("alerteProd").innerHTML = proches ? '<div class="alerte">' + t("alerte") + proches + '</div>' : "";
  $("listeProd").innerHTML = html || t("rien");
}

/* ---------- Dettes ---------- */
async function ajoutDette(){
  msg("");
  const c = $("dNom").value.trim();
  if (!c) return msg(t("nomReq"));
  const { error } = await db.from("debts").insert({ shop_id: shopId, customer_name: c, amount: parseFloat($("dMont").value) || 0 });
  if (error) return msg(error.message);
  $("dNom").value = $("dMont").value = "";
  chargerDet();
}
async function payer(id){ await db.from("debts").update({ paid: true }).eq("id", id); chargerDet(); }
async function chargerDet(){
  const { data } = await db.from("debts").select("*").eq("shop_id", shopId).order("created_at", { ascending: false });
  let total = 0, html = "";
  (data || []).forEach(d => {
    if (!d.paid) total += Number(d.amount);
    html += '<div class="ligne"><span class="' + (d.paid ? "vert" : "") + '">' + esc(d.customer_name) + ' : ' + d.amount + ' FC</span><span>'
      + (d.paid ? "✔" : '<button class="petit" onclick="payer(\'' + d.id + '\')">' + t("paye") + '</button>')
      + '<button class="petit gris" onclick="suppr(\'debts\',\'' + d.id + '\')">' + t("suppr") + '</button></span></div>';
  });
  $("totDet").textContent = t("totDet") + total + " FC";
  $("listeDet").innerHTML = html || t("rien");
}

/* ---------- Ventes ---------- */
async function ajoutVente(){
  msg("");
  const n = $("vNom").value.trim();
  if (!n) return msg(t("nomReq"));
  const { error } = await db.from("sales").insert({ shop_id: shopId, product_name: n, amount: parseFloat($("vMont").value) || 0 });
  if (error) return msg(error.message);
  $("vNom").value = $("vMont").value = "";
  chargerVen();
}
async function chargerVen(){
  const debut = new Date(); debut.setHours(0,0,0,0);
  const { data } = await db.from("sales").select("*").eq("shop_id", shopId)
    .gte("created_at", debut.toISOString()).order("created_at", { ascending: false });
  let total = 0, html = "";
  (data || []).forEach(v => {
    total += Number(v.amount);
    html += '<div class="ligne"><span>' + esc(v.product_name) + ' : ' + v.amount + ' FC</span>'
      + '<button class="petit gris" onclick="suppr(\'sales\',\'' + v.id + '\')">' + t("suppr") + '</button></div>';
  });
  $("totVen").textContent = t("totVen") + total + " FC";
  $("listeVen").innerHTML = html || t("rien");
}

async function suppr(table, id){
  await db.from(table).delete().eq("id", id);
  chargerProd(); chargerDet(); chargerVen();
}

/* ---------- Propriétaire Dukyo ---------- */
async function chargerAdmin(){
  const { data: shops } = await db.from("shops").select("id,name").order("created_at");
  const { data: prods } = await db.from("products").select("shop_id");
  const { data: dets } = await db.from("debts").select("shop_id").eq("paid", false);
  let html = "";
  (shops || []).forEach(s => {
    const np = (prods || []).filter(x => x.shop_id === s.id).length;
    const nd = (dets || []).filter(x => x.shop_id === s.id).length;
    html += '<div class="ligne"><span>' + esc(s.name) + '</span><small>' + np + ' ' + t("prodN") + ', ' + nd + ' ' + t("detN") + '</small></div>';
  });
  $("listeAdmin").innerHTML = html || t("rien");
}

async function afficher(){
  ["auth","creer","bienv","app","admin"].forEach(i => $(i).style.display = "none");
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $("auth").style.display = "block"; return; }
  const { data: estAdmin } = await db.rpc("is_admin");
  if (estAdmin === true) { $("admin").style.display = "block"; chargerAdmin(); return; }
  const { data, error } = await db.from("shops").select("id,name").eq("owner_id", session.user.id).limit(1);
  if (error) { msg(error.message); $("auth").style.display = "block"; return; }
  if (data.length === 0) { $("creer").style.display = "block"; return; }
  shopId = data[0].id;
  if (localStorage.getItem("welcome") === "1") { $("bienv").style.display = "block"; return; }
  $("titre").textContent = data[0].name;
  $("app").style.display = "block";
  chargerProd(); chargerDet(); chargerVen();
}
langue(L);
afficher();
</script>
</body>
</html>
